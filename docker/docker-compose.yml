version: '3.8'

services:
  backend:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/visionguard
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - datasets-data:/app/datasets
      - models-data:/app/models
      - reports-data:/app/reports
      - uploads-data:/app/uploads
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=visionguard
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  datasets-data:
  models-data:
  reports-data:
  uploads-data:
  pg-data:
