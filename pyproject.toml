[project]
name = "inspectiq"
version = "1.0.0"
description = "AI-powered inspection platform"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "websockets>=12.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.1.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "optuna>=3.6.0",
    "matplotlib>=3.8.0",
]

[tool.vercel]
entrypoint = "backend.main:app"